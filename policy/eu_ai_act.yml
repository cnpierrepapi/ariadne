# Regulation (EU) 2024/1689, the AI Act, for high risk systems under Annex III.
#
# Materially wider than ECOA in one respect that matters to the tooling. ECOA
# prohibits named bases in a credit decision. Article 10 asks for examination for
# biases likely to affect fundamental rights, which is a duty to look rather than a
# list of forbidden columns. So this regime puts `personal_data` in scope as well as
# `protected_attribute`, and a column like a neighbourhood identifier that ECOA does
# not name becomes something to examine and document here.
#
# That difference is the point of keeping regimes in separate files. The same
# warehouse and the same checks produce different findings under each, without a
# line of code changing.
#
# Verify against current text before relying on any citation below. Article numbers
# reflect the Regulation as published and are unchanged.
#
# TIMING, AND IT MOVED. The Digital Omnibus on AI, approved by the Council on
# 29 June 2026, deferred standalone Annex III high risk obligations to 2 December
# 2027, and Annex I product embedded ones to 2 August 2028. Articles 9 to 17 move
# with them. The Article 50 transparency duties did take effect on 2 August 2026.
# So this pack describes an obligation that is coming rather than one that binds
# today. What it asks for did not change, only when. The ecoa, employment_us and
# canada packs cite law that is in force now.

name: EU AI Act
long_name: Regulation (EU) 2024/1689, Annex III high risk systems
jurisdiction: European Union
decision_context: >
  High risk AI systems under Annex III, including creditworthiness and credit
  scoring, life and health insurance pricing, employment and worker management,
  education and vocational training, and access to essential services.
citation: Article 10(2)(f), Article 10(2)(g), Article 9, Annex IV

protected_tags:
  - protected_attribute
  - personal_data

restricted:

  - attribute: race
    basis: prohibited
    citation: Article 10(2)(f), GDPR Article 9(1)
    note: >
      Racial or ethnic origin is a special category under GDPR Article 9. Article
      10(5) of the AI Act permits processing it where strictly necessary for bias
      detection and correction, subject to safeguards, which is what makes
      measuring reconstructability lawful rather than a workaround.

  - attribute: sex
    basis: prohibited
    citation: Article 10(2)(f)

  - attribute: disability
    basis: prohibited
    citation: Article 10(2)(f), GDPR Article 9(1)
    note: Health data is a special category under GDPR Article 9.

  - attribute: citizenship
    basis: examine
    citation: Article 10(2)(f)

  - attribute: nativity
    basis: examine
    citation: Article 10(2)(f)

  - attribute: place_of_birth
    basis: examine
    citation: Article 10(2)(f)

  - attribute: ancestry
    basis: prohibited
    citation: Article 10(2)(f), GDPR Article 9(1)
    note: Ethnic origin is a special category under GDPR Article 9.

  - attribute: marital_status
    basis: examine
    citation: Article 10(2)(f)

  - attribute: age
    basis: examine
    citation: Article 10(2)(f)
    note: >
      Not a special category, but a characteristic whose effect on fundamental
      rights Article 10 expects to be examined and documented.

# Duties about the decision rather than about which columns are restricted.
# See the same block in canada.yml for why these are declared and not compiled in.
duties:

  - name: Explanation of individual decision making
    citation: Regulation (EU) 2024/1689, Article 86
    applies_when: >
      A decision is taken by a deployer on the basis of output from an Annex III
      high risk system and produces legal effects or similarly significantly
      affects the person.
    requires:
      - On request, give the affected person clear and meaningful explanations of
        the role of the AI system in the decision procedure.
      - Explain the main elements of the decision taken.
    ariadne_supplies:
      - The main elements at the level of the model, being the features it
        consumed and where each came from.
      - Provenance for every feature, so an explanation can be checked rather than
        asserted.
    not_supplied:
      - Per person explanation. This document is about the model.
      - Delivering the explanation on request.

  - name: Record keeping and logs
    citation: Regulation (EU) 2024/1689, Article 12; Article 19; Annex IV
    applies_when: >
      Throughout the lifetime of an Annex III high risk system.
    requires:
      - Automatically record events over the system's lifetime, to a degree
        appropriate to its intended purpose.
      - Enable identification of situations that may present a risk or lead to a
        substantial modification.
      - Retain the logs for an appropriate period, and be able to produce the
        technical documentation of Annex IV.
    ariadne_supplies:
      - A dated, retained measurement record per model version, including the
        measurements that found nothing.
      - Detection of substantial modification in the sense that matters here, a
        change in what the model can infer about a person.
      - The lineage behind each finding, which is part of what Annex IV asks be
        documented about data and data governance.
    not_supplied:
      - Inference time logging of individual uses of the system.
      - The rest of the Annex IV file, most of which is about the system's design
        and intended purpose rather than its data.
