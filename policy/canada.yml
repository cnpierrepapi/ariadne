# Canadian Human Rights Act, RSC 1985 c. H-6, section 3.
#
# The federal ground list, and the closest Canadian analogue to ECOA and to Title
# VII in one instrument: section 3 governs both employment and the provision of
# services, so a hiring model and a credit model at a federally regulated bank are
# read against the same enumerated grounds.
#
# TWO DIFFERENCES FROM THE US PACKS ARE THE REASON THIS FILE EARNS ITS KEEP.
#
#   age             ECOA permits age in a demonstrably and statistically sound
#                   credit scoring system, 12 CFR 1002.2(p), so `ecoa.yml` calls it
#                   conditional. Section 3 enumerates age with no such carve out, so
#                   here it is prohibited. Same column, same warehouse, different
#                   answer, and the difference is a line of YAML.
#
#   marital status  Not a federally protected class in US employment, so
#                   `employment_us.yml` calls it examine. Section 3 enumerates it
#                   outright.
#
# WATCHES `protected_attribute` ONLY, unlike the EU pack. Section 3 is a list of
# prohibited grounds, not a duty to examine personal data generally, so a column
# tagged `personal_data` and nothing else does not enter scope by tag here. That is
# the correct reading and it leaves a real gap, which the reconstruction delta watch
# is what closes: it fires on a prohibited ground becoming easier to rebuild whether
# or not anybody tagged the column that did it.
#
# SCOPE. The Act binds federally regulated activity: banks, telecommunications,
# air, rail and marine transport, federal Crown corporations and the federal public
# service. MOST PRIVATE EMPLOYERS IN CANADA ARE NOT COVERED and fall under a
# provincial or territorial human rights code instead. Those codes enumerate similar
# but not identical grounds and are not modelled here. Do not read a clean result
# from this pack as a clean result for a provincially regulated employer.
#
# NOT MODELLED, because this warehouse does not declare the attribute: religion,
# sexual orientation, gender identity or expression, family status, genetic
# characteristics, and conviction for which a pardon or record suspension was
# granted. They are grounds under section 3 and their absence here is a gap in the
# data, not a finding of compliance.
#
# THE ARTIFICIAL INTELLIGENCE AND DATA ACT IS NOT LAW AND IS DELIBERATELY ABSENT.
# AIDA was Part 3 of Bill C-27. The bill died on the order paper when Parliament was
# prorogued in January 2025 and no federal AI statute has been enacted since. Checked
# July 2026. If a successor is introduced it belongs in its own file, and until it is
# in force nothing here should cite it.
#
# ADJACENT OBLIGATIONS THIS PACK DOES NOT DISCHARGE.
#   Quebec Law 25, s. 12.1   Where a decision is based exclusively on automated
#                            processing, the person must be told, given the personal
#                            information used and the principal factors, and offered
#                            human review. That is a duty about the decision, not a
#                            list of forbidden columns, so it is not expressible as
#                            restricted attributes. The lineage and the timestamped
#                            measurement record supply evidence toward the "principal
#                            factors" limb. They do not satisfy the notice or the
#                            human review limbs, which are product decisions.
#   PIPEDA                   Governs collection, use and disclosure of personal
#                            information. Orthogonal to which grounds are prohibited.
#
# Section 15 provides a bona fide occupational requirement and bona fide
# justification defence, subject to accommodation short of undue hardship. It applies
# across the grounds rather than to particular ones, so it is not modelled as a
# per attribute `conditional` basis. Every entry below is therefore prohibited, and
# that flatness is itself the contrast with ECOA.
#
# Verify against the current consolidation before relying on any citation. Text
# checked against laws-lois.justice.gc.ca, Act current to 14 June 2026.

name: Canadian Human Rights Act
long_name: Canadian Human Rights Act, RSC 1985 c. H-6, section 3
jurisdiction: Canada, federally regulated sectors
decision_context: >
  Employment and the provision of goods, services, facilities or accommodation
  customarily available to the general public, by federally regulated employers and
  service providers: banks, telecommunications carriers, air, rail and marine
  transport, federal Crown corporations and the federal public service. Provincially
  regulated employers are governed by a provincial or territorial code instead.
citation: RSC 1985 c. H-6, s. 3; s. 3(2); s. 3(3); s. 15

protected_tags:
  - protected_attribute

restricted:

  - attribute: race
    basis: prohibited
    citation: RSC 1985 c. H-6, s. 3
    note: >
      Section 3 enumerates race, national or ethnic origin, and colour as three
      separate grounds. race_code carries the first and the third.

  - attribute: sex
    basis: prohibited
    citation: RSC 1985 c. H-6, s. 3, s. 3(2)
    note: >
      Section 3(2) deems discrimination on the ground of pregnancy or childbirth to
      be discrimination on the ground of sex, so the ground is wider than the column.

  - attribute: disability
    basis: prohibited
    citation: RSC 1985 c. H-6, s. 3
    note: >
      Enumerated without qualification. Section 25 defines disability to include a
      previous or existing dependence on alcohol or a drug, which is wider than the
      PUMS DIS coding this warehouse holds.

  - attribute: age
    basis: prohibited
    citation: RSC 1985 c. H-6, s. 3
    note: >
      Prohibited outright. There is no equivalent of the ECOA carve out at
      12 CFR 1002.2(p) permitting age in a demonstrably and statistically sound
      credit scoring system, so a scoring model that is defensible under ECOA on
      this column is not defensible here on the same reasoning.

  - attribute: marital_status
    basis: prohibited
    citation: RSC 1985 c. H-6, s. 3
    note: >
      Enumerated, alongside family status as a separate ground. This is the sharpest
      divergence from employment_us.yml, which can only call it examine because it is
      not a federally protected class in US employment law.

  - attribute: citizenship
    basis: prohibited
    citation: RSC 1985 c. H-6, s. 3
    note: In scope through the national or ethnic origin ground.

  - attribute: nativity
    basis: prohibited
    citation: RSC 1985 c. H-6, s. 3
    note: In scope through the national or ethnic origin ground.

  - attribute: place_of_birth
    basis: prohibited
    citation: RSC 1985 c. H-6, s. 3
    note: In scope through the national or ethnic origin ground.

  - attribute: ancestry
    basis: prohibited
    citation: RSC 1985 c. H-6, s. 3
    note: In scope through the national or ethnic origin ground.
