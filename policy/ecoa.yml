# Equal Credit Opportunity Act, Regulation B.
#
# The oldest and clearest of the regimes here, which is why the reference stack
# models a credit decision. Attributes are named as declared in attributes.yml.
#
# `basis` decides what a finding means, and the three levels are not decoration:
#
#   prohibited   No exception exists. A finding is a finding.
#   conditional  Permitted under a stated condition, so a finding is a question
#                for a person rather than a fault.
#   examine      Not prohibited, but the regime expects documented examination.
#
# Verify against current text before relying on any citation below. This is
# engineering configuration, not legal advice.

name: ECOA
long_name: Equal Credit Opportunity Act, Regulation B
jurisdiction: United States
decision_context: Credit and lending decisions about a person
citation: 15 USC 1691(a), 12 CFR 1002.6(b)

# a column carrying any of these tags is in scope for this regime
protected_tags:
  - protected_attribute

restricted:

  - attribute: race
    basis: prohibited
    citation: 15 USC 1691(a)(1)

  - attribute: sex
    basis: prohibited
    citation: 15 USC 1691(a)(1)

  - attribute: marital_status
    basis: prohibited
    citation: 15 USC 1691(a)(1)

  - attribute: citizenship
    basis: prohibited
    citation: 15 USC 1691(a)(1)
    note: >
      National origin is a prohibited basis. Citizenship status is a close proxy
      for it, and Regulation B permits enquiry into permanent residency only to
      the extent needed to establish creditworthiness.

  - attribute: nativity
    basis: prohibited
    citation: 15 USC 1691(a)(1)
    note: A direct proxy for national origin.

  - attribute: place_of_birth
    basis: prohibited
    citation: 15 USC 1691(a)(1)
    note: A direct proxy for national origin.

  - attribute: ancestry
    basis: prohibited
    citation: 15 USC 1691(a)(1)
    note: A proxy for national origin and ethnicity.

  - attribute: age
    basis: conditional
    citation: 12 CFR 1002.2(p)
    note: >
      Age may be used in an empirically derived, demonstrably and statistically
      sound credit scoring system, provided applicants aged 62 and over are not
      treated less favourably. So a finding on age is a question about whether the
      system meets that standard, not a fault on its own.

# Duties about the decision rather than about which columns are restricted.
# See the same block in canada.yml for why these are declared and not compiled in.
duties:

  - name: Adverse action notice, with specific reasons
    citation: 15 USC 1691(d); 12 CFR 1002.9
    applies_when: >
      Credit is denied, or an existing account is revoked or its terms changed
      unfavourably. Applies whether or not the decision was automated, which makes
      it wider in reach than the Quebec automated decision duty and narrower in
      what it asks for.
    requires:
      - Notify the applicant of the action taken within thirty days.
      - State the SPECIFIC principal reasons for the adverse action, not merely
        that a scoring system was used. A general reference to a model does not
        satisfy this.
      - Where a credit score was used, disclose the score, the range, and the key
        factors that adversely affected it.
      - State the applicant's right to a statement of reasons where one was not
        provided.
    ariadne_supplies:
      - The features the deployed model actually consumed, so the reasons given
        can be checked against what the model could in fact have used.
      - Evidence that a prohibited basis is not reaching the model, or that it is,
        which is the prior question to whether the stated reasons are the real ones.
    not_supplied:
      - The reasons for one applicant's denial. Per decision attribution is a
        different computation from anything in this document.
      - The score, range and factor disclosure, which come from the scoring system.
      - Delivering the notice within thirty days.
